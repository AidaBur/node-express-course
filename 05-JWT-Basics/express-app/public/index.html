<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>JWT App</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/css/bootstrap.min.css">
</head>
<body>
  <div class="container mt-5">
    <h1>JWT Authentication</h1>
    <form class="form">
      <input type="text" placeholder="Username" class="username-input form-control mb-2" />
      <input type="password" placeholder="Password" class="password-input form-control mb-2" />
      <button type="submit" class="btn btn-primary">Login</button>
      <p class="form-alert mt-2"></p>
    </form>
    <button id="data" class="btn btn-info mt-2">Get Protected Data</button>
    <div class="result mt-3"></div>
    <p class="token mt-3"></p>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
